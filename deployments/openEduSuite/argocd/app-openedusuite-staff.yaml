apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openedusuite-staff
  namespace: argocd
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hydrate: normal
    argocd.argoproj.io/sync-options: Prune=true
spec:
  project: scs
  source:
    repoURL: ssh://git@gitlab.hrz.uni-marburg.de/hrz/kubernetes/openedusuite/openedusuite.git
    targetRevision: main
    path: k8s/openedusuite-staff
  destination:
    server: https://kubernetes.default.svc
    namespace: openedusuite-staff
  ignoreDifferences:
  # Backup-PVCs: Bind-Status (phase/accessModes/capacity) ist k8s-verwaltet -> ignorieren
  - group: ""
    kind: PersistentVolumeClaim
    jsonPointers:
    - /status
  - group: ""
    kind: Service
    jsonPointers:
    - /status
  - group: apps
    kind: Deployment
    jsonPointers:
    - /status
    - /metadata/annotations/kubectl.kubernetes.io~1restartedAt
  # k8s-verwaltete Metadata/Status generisch ignorieren (Standard-Satz)
  - group: "*"
    kind: "*"
    jsonPointers:
    - /metadata/generation
    - /metadata/creationTimestamp
    - /metadata/resourceVersion
    - /metadata/uid
    - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
    - /metadata/annotations/kubectl.kubernetes.io~1restartedAt
    - /metadata/annotations/deployment.kubernetes.io~1revision
    - /metadata/annotations/argocd.argoproj.io~1tracking-id
    - /status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
    - RespectIgnoreDifferences=true
