# operation — Operaton 2.1.5 BPM stack (overlay: deployment + worker + ingress).
# Repo-Fix: zeigte früher auf aufgelöstes openedusuite.git → jetzt opendesk-edu.git.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: operaton
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: scs
  source:
    repoURL: ssh://git@gitlab.hrz.uni-marburg.de/hrz/kubernetes/openedusuite/openedusuite.git
    targetRevision: main
    path: k8s/operaton/overlay
  destination:
    server: https://kubernetes.default.svc
    namespace: openedusuite
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jqPathExpressions:
    - .status.terminatingReplicas
  - group: "*"
    kind: "*"
    jsonPointers:
    - /metadata/generation
    - /metadata/creationTimestamp
    - /metadata/resourceVersion
    - /metadata/uid
    - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
    - /metadata/annotations/kubectl.kubernetes.io~1restartedAt
    - /metadata/annotations/deployment.kubernetes.io~1revision
    - /metadata/annotations/argocd.argoproj.io~1tracking-id
    - /status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
